# Render Blueprint: one free web service. Render asks for the three secrets on first deploy (sync: false),
# so they never live in this repo. RENDER_EXTERNAL_URL is set by Render and used for PayPal's return URLs.
services:
  - type: web
    name: paywebbie
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
